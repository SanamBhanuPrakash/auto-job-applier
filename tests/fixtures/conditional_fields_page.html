<!doctype html>
<html><head><meta charset="utf-8"><title>Application — Acme</title></head>
<body>
<form id="application-form">
  <div><label for="first_name">First Name*</label><input id="first_name" name="first_name" required></div>
  <div><label for="email">Email*</label><input type="email" id="email" name="email" required></div>
  <div><label for="phone">Phone</label><input type="tel" id="phone" name="phone"></div>

  <!-- The conditional section: answering "Yes" reveals a *different*
       sensitive question. The visible option labels stay "Yes"/"No", so a
       state digest that ignored group context would not register the
       change (browser-agent-failures.md §13). -->
  <fieldset>
    <legend>Are you legally authorized to work in the United States?*</legend>
    <label><input type="radio" name="work_auth" value="yes" onclick="document.getElementById('sponsor').hidden=false"> Yes</label>
    <label><input type="radio" name="work_auth" value="no" onclick="document.getElementById('sponsor').hidden=false"> No</label>
  </fieldset>

  <fieldset id="sponsor" hidden>
    <legend>Will you now or in the future require visa sponsorship?*</legend>
    <label><input type="radio" name="sponsorship" value="yes"> Yes</label>
    <label><input type="radio" name="sponsorship" value="no"> No</label>
  </fieldset>

  <div><label for="notes">Anything else?</label><textarea id="notes" name="notes"></textarea></div>
  <button type="submit" id="submit">Submit Application</button>
</form>
</body></html>
