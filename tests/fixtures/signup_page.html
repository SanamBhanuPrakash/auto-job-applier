<!doctype html>
<html><head><meta charset="utf-8"><title>Create an account — Acme Careers</title></head>
<body>
  <h1>Create an account to apply</h1>
  <p>New candidate account required before you can submit an application.</p>
  <form id="signup">
    <label for="email">Email</label><input id="email" type="email">
    <label for="password">Password</label><input id="password" type="password">
    <label for="confirm">Confirm password</label><input id="confirm" type="password">
    <button type="submit">Create account</button>
  </form>
</body></html>
