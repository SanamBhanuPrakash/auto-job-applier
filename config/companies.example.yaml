  - ramp
  - notion
  - vercel
  - openai
  - perplexity
  - runway

# Discovery-only for both of these — see README "Extending to more ATSes /
# sites" for why submission isn't implemented (SmartRecruiters' apply flow
# is DataDome-protected).
smartrecruiters:
  - Visa
  - Bosch

recruitee:
  []
