# Copy to config/companies.yaml and edit.
#
# ATS job-board APIs have no "list all companies" endpoint — you must supply
# each employer's board slug yourself. Find it by opening the company's
# careers page: the URL or network tab reveals the slug, e.g.
#   https://boards.greenhouse.io/stripe          -> greenhouse slug "stripe"
#   https://jobs.lever.co/netflix                -> lever slug "netflix"
#   https://jobs.ashbyhq.com/linear              -> ashby slug "linear"
#   https://acme.wd5.myworkdayjobs.com/en-US/acme_careers -> workday: paste the FULL url
#
# Every slug below was checked live (not guessed) against each API right
# before this file was written — see the "India-hiring" note per section.
# That said, ATS boards change: a company can migrate providers or a slug
# can go stale, and jobbot/discovery/*.py already logs a warning and moves
# on for any that stop responding, so a dead entry here costs nothing.
#
# Honest limitation: many well-known Indian companies (most large Indian
# unicorns among them) use an ATS this project doesn't talk to yet —
# Darwinbox, Keka, Turbohire, or an in-house system — not Greenhouse/Lever/
# Ashby/SmartRecruiters/Recruitee. A long list of India-founded companies
# was checked while building this list and came back empty for exactly that
# reason. The bigger lever for real India job *volume* is the Adzuna
# aggregator in settings.example.yaml, which searches across many boards at
# once by city rather than needing one entry per employer here.

greenhouse:
  # Broad global/remote-friendly coverage, all confirmed to have current
  # open postings.
  - stripe
  - airbnb
  - coinbase
  - robinhood
  - pinterest
  - instacart
  - asana
  - discord
  - databricks
  - snowflake
  - confluent
  - hashicorp
  - airtable
  - figma
  - canva
  - gitlab
  - grafanalabs
  - elastic
  - mongodb
  - twilio
  - digitalocean
  - cloudflare
  - datadog
  - pagerduty
  - amplitude
  - braze
  - postman
  - vercel
  - brex
  - dropbox
  - okta
  - intercom
  - gusto
  - reddit
  - squarespace
  - wise
  - n26
  - monzo
  # Confirmed live: substantial India-based hiring specifically.
  - highradius
  - phonepe

lever:
  - plaid
  - lever
  # Confirmed live: majority-India or India-heavy hiring.
  - cred
  - meesho
  - zeta

ashby:
  - linear
  - ramp
  - notion
  - vercel
  - openai
  - perplexity
  - runway

# Discovery-only for all three below — see README "Extending to more ATSes
# / sites" for why submission isn't implemented for each (SmartRecruiters'
# apply flow is DataDome-protected; Workday's needs a candidate account per
# employer — clicking Apply on a real posting goes straight to a Sign In
# wall, confirmed live, same category as Wellfound/Cutshort).
smartrecruiters:
  - Visa
  - Bosch

# Paste the full careers URL, not a bare slug — see the header note above.
# All four confirmed live (POST .../wday/cxs/<tenant>/<site>/jobs, no auth).
workday:
  - https://automationanywhere.wd5.myworkdayjobs.com/en-US/automationanywherejobs
  - https://workday.wd5.myworkdayjobs.com/Workday
  - https://bdx.wd1.myworkdayjobs.com/EXTERNAL_CAREER_SITE_INDIA # BD, explicitly India-focused site
  - https://ouryahoo.wd5.myworkdayjobs.com/careers

recruitee:
  []
