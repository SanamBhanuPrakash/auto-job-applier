[project]
name = "jobbot"
version = "0.1.0"
description = "Local-first job discovery and assisted-application agent"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
    "groq>=0.11",
    "anthropic>=0.34",
    "playwright>=1.45",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
jobbot = "jobbot.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
